name: Docker Image Promotion

on:
  push:
    branches:
      - main

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: myapp

jobs:

  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate Version
        id: version
        run: |
          VERSION=v1.0.${GITHUB_RUN_NUMBER}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login To ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build \
            -t $ECR_REPOSITORY:${{ steps.version.outputs.version }} .

      - name: Push Base Image
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity \
          --query Account --output text)

          ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker tag \
            $ECR_REPOSITORY:${{ steps.version.outputs.version }} \
            $ECR_URI/$ECR_REPOSITORY:${{ steps.version.outputs.version }}

          docker push \
            $ECR_URI/$ECR_REPOSITORY:${{ steps.version.outputs.version }}

  deploy-dev:

    runs-on: ubuntu-latest
    needs: build

    environment: dev

    steps:

      - name: Deploy To DEV
        run: |
          echo "Deploy image ${{
            needs.build.outputs.version
          }} to DEV"

          # terragrunt apply
          # ecs update-service

  promote-to-qa:

    runs-on: ubuntu-latest
    needs: deploy-dev

    environment: qa-approval

    steps:

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Retag DEV -> QA
        run: |

          VERSION=${{ needs.build.outputs.version }}

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker pull \
            $ECR_URI/$ECR_REPOSITORY:$VERSION

          docker tag \
            $ECR_URI/$ECR_REPOSITORY:$VERSION \
            $ECR_URI/$ECR_REPOSITORY:qa-$VERSION

          docker push \
            $ECR_URI/$ECR_REPOSITORY:qa-$VERSION

  deploy-qa:

    runs-on: ubuntu-latest
    needs: promote-to-qa

    environment: qa

    steps:

      - name: Deploy QA Image
        run: |

          IMAGE_TAG=qa-${{ needs.build.outputs.version }}

          echo "Deploy $IMAGE_TAG to QA"

          # terragrunt apply

  promote-to-uat:

    runs-on: ubuntu-latest
    needs: deploy-qa

    environment: uat-approval

    steps:

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Retag QA -> UAT
        run: |

          VERSION=${{ needs.build.outputs.version }}

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker pull \
            $ECR_URI/$ECR_REPOSITORY:qa-$VERSION

          docker tag \
            $ECR_URI/$ECR_REPOSITORY:qa-$VERSION \
            $ECR_URI/$ECR_REPOSITORY:uat-$VERSION

          docker push \
            $ECR_URI/$ECR_REPOSITORY:uat-$VERSION

  deploy-uat:

    runs-on: ubuntu-latest
    needs: promote-to-uat

    environment: uat

    steps:

      - name: Deploy UAT
        run: |

          IMAGE_TAG=uat-${{ needs.build.outputs.version }}

          echo "Deploy $IMAGE_TAG to UAT"

  promote-to-prod:

    runs-on: ubuntu-latest
    needs: deploy-uat

    environment: prod-approval

    steps:

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Retag UAT -> PROD
        run: |

          VERSION=${{ needs.build.outputs.version }}

          ACCOUNT_ID=$(aws sts get-caller-identity \
            --query Account \
            --output text)

          ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

          docker pull \
            $ECR_URI/$ECR_REPOSITORY:uat-$VERSION

          docker tag \
            $ECR_URI/$ECR_REPOSITORY:uat-$VERSION \
            $ECR_URI/$ECR_REPOSITORY:prod-$VERSION

          docker push \
            $ECR_URI/$ECR_REPOSITORY:prod-$VERSION

  deploy-prod:

    runs-on: ubuntu-latest
    needs: promote-to-prod

    environment: prod

    steps:

      - name: Deploy Production
        run: |

          IMAGE_TAG=prod-${{ needs.build.outputs.version }}

          echo "Deploy $IMAGE_TAG to PROD"

          # terragrunt apply
